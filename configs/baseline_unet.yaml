dataset:
  root: "data/BraTS2021"
  norm_method: "zscore"
  tight_crop: true
  add_foreground_channel: false
  target_mode: "regions"

model:
  name: "baseline_unet"
  in_channels: 4
  num_classes: 3
  channels: [32, 64, 128, 256, 320]
  norm_type: "instance"

training:
  batch_size: 1
  patch_size: [128, 128, 128]
  epochs: 100
  optimizer: "adamw"
  learning_rate: 0.0001
  weight_decay: 0.00001
  scheduler: "polynomial"
  amp: true
  gradient_accumulation_steps: 1
  gradient_clip_norm: 12.0
  early_stopping_patience: 25

loss:
  name: "dice_ce"
  batch_dice: true
  deep_supervision: false

augmentation:
  enabled: true
  flip_prob: 0.5
  rot90_prob: 0.3
  gamma_prob: 0.3

inference:
  roi_size: [128, 128, 128]
  overlap: 0.5
